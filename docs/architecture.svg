<svg xmlns="http://www.w3.org/2000/svg" width="2180" height="3470" viewBox="0 0 2180 3470"><defs><marker id="end" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1e293b" stroke-width="1.5"/></marker><marker id="start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#1e293b" stroke-width="1.5"/></marker></defs><rect width="2180" height="3470" fill="white"/><text x="40" y="59.0" fill="#1e293b" font-size="34" font-family="Arial,sans-serif">Glot conversation API — actors, boundaries and data flow</text>
<text x="40" y="103.0" fill="#1e293b" font-size="23" font-family="Arial,sans-serif">One application socket carries both speakers. Two provider streams translate independently.</text>
<rect x="590" y="150" width="1080" height="740" rx="12" fill="#f8fafc" stroke="#1e293b" stroke-width="2" stroke-dasharray="9 7"/>
<text x="615" y="195.0" fill="#1e293b" font-size="25" font-family="Arial,sans-serif">OUR PLATFORM — one Python process</text>
<text x="615" y="229.0" fill="#1e293b" font-size="19" font-family="Arial,sans-serif">Boxes inside are code modules, not separate network services.</text>

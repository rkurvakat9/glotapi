<text x="900" y="302.0" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">receive() → (speaker, audio)</text>
<text x="900" y="324.1" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">emit(event) → client</text>
<text x="900" y="346.2" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">Python function calls</text>
<rect x="1280" y="400" width="350" height="180" rx="12" fill="#fef3c7" stroke="#1e293b" stroke-width="2" />
<text x="1300" y="433.0" fill="#1e293b" font-size="23" font-family="Arial,sans-serif">provider_contract.py</text>
<text x="1300" y="463.0" fill="#1e293b" font-size="20" font-family="Arial,sans-serif">Translation provider interface</text>
<text x="1300" y="498.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Provider.open(target language)</text>
<text x="1300" y="521.4" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Stream.send() / finish() / events()</text>
<text x="1300" y="544.8" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Delta(kind, data)</text>
<polyline points="1230,490 1270,490" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)" marker-start="url(#start)" />
<text x="1280" y="323.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">INTERFACE BOUNDARY</text>
<text x="1280" y="346.4" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Application owns the contract</text>
<rect x="1280" y="670" width="350" height="165" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="2" />
<text x="1300" y="711.0" fill="#1e293b" font-size="21" font-family="Arial,sans-serif">providers.py — OpenAI adapter</text>
<text x="1300" y="753.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Implements Provider / Stream</text>
<text x="1300" y="776.4" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Maps vendor events to Delta</text>
<text x="1300" y="799.8" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Opens two upstream sockets</text>
<polyline points="1455,590 1455,660" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)" marker-start="url(#start)" />
<rect x="950" y="670" width="270" height="165" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="2" />
<text x="970" y="712.0" fill="#1e293b" font-size="22" font-family="Arial,sans-serif">Fake provider</text>
<text x="970" y="752.0" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">Same contract</text>
<text x="970" y="774.1" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">In-memory demo output</text>
<text x="970" y="796.2" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">No network / no translation</text>
<polyline points="1320,590 1320,625 1085,625 1085,660" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="7 5"/>
<text x="970" y="868.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Choose ONE implementation: fake OR OpenAI.</text>
<rect x="1770" y="650" width="360" height="210" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="2" stroke-dasharray="9 7"/>
<text x="1790" y="692.0" fill="#1e293b" font-size="22" font-family="Arial,sans-serif">EXTERNAL TRANSLATION</text>
<text x="1790" y="733.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Stream 1: Alice → Jorge</text>
<text x="1790" y="756.4" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">English audio → Spanish output</text>
<text x="1790" y="779.8" fill="#1e293b" font-size="18" font-family="Arial,sans-serif"></text>
<text x="1790" y="803.2" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Stream 2: Jorge → Alice</text>
<text x="1790" y="826.6" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Spanish audio → English output</text>
<polyline points="1640,725 1760,725" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)" marker-start="url(#start)" />
<polyline points="1640,800 1760,800" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)" marker-start="url(#start)" />
<text x="1685" y="608.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">TWO provider</text>
<text x="1685" y="631.4" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">WebSockets</text>
<text x="40" y="972.0" fill="#1e293b" font-size="22" font-family="Arial,sans-serif">INPUT: start → labelled audio chunks → end</text>
<text x="40" y="1012.0" fill="#1e293b" font-size="22" font-family="Arial,sans-serif">OUTPUT: ready → text / audio deltas with speaker + recipient → ended</text>
<text x="40" y="1059.0" fill="#1e293b" font-size="19" font-family="Arial,sans-serif">On end: finish both providers → deliver remaining output → close streams. Source transcripts return to their speaker.</text>
<text x="40" y="1222.0" fill="#1e293b" font-size="32" font-family="Arial,sans-serif">Conversation sequence — what the code does</text>
<text x="40" y="1267.0" fill="#1e293b" font-size="22" font-family="Arial,sans-serif">Read from top to bottom. Input forwarding and both output tasks run concurrently.</text>

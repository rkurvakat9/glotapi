<text x="410" y="351.4" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">/v1/conversations</text>
<rect x="950" y="400" width="270" height="180" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2" />
<text x="970" y="433.0" fill="#1e293b" font-size="23" font-family="Arial,sans-serif">service.py</text>
<text x="970" y="461.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Conversation coordination</text>
<text x="970" y="498.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Route audio and results</text>
<text x="970" y="521.4" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Own stream lifecycle</text>
<text x="970" y="544.8" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Serialize output with lock</text>

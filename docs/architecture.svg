<text x="645" y="433.0" fill="#1e293b" font-size="23" font-family="Arial,sans-serif">api.py</text>
<text x="645" y="463.0" fill="#1e293b" font-size="20" font-family="Arial,sans-serif">WebSocket API</text>
<text x="645" y="498.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Accept WebSocket</text>
<text x="645" y="521.4" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Parse and validate JSON</text>
<text x="645" y="544.8" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Send JSON responses</text>

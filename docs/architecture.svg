<text x="665" y="1504.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">converse(receive, emit, provider)</text>
<text x="1090" y="1568.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Validate two participants</text>
<polyline points="1070,1630 1490,1630" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="1085" y="1614.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">open(target = Spanish)</text>
<polyline points="1070,1720 1910,1720" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="1085" y="1704.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">open(target = English)</text>
<text x="1090" y="1768.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Start two output tasks</text>
<polyline points="1070,1830 650,1830" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="665" y="1814.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">publish ready → emit()</text>
<polyline points="650,1900 230,1900" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="7 5"/>
<text x="245" y="1884.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">ready</text>
<rect x="80" y="1940" width="2020" height="590" rx="12" fill="#f8fafc" stroke="#1e293b" stroke-width="2" stroke-dasharray="9 7"/>
<text x="100" y="1977.0" fill="#1e293b" font-size="22" font-family="Arial,sans-serif">WHILE THE CONVERSATION IS ACTIVE — repeats for incoming chunks and provider deltas</text>
<polyline points="230,2035 650,2035" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="245" y="2019.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Alice audio chunk</text>
<text x="670" y="2067.0" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">Parse + validate message</text>
<polyline points="650,2140 1070,2140" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="7 5"/>
<text x="665" y="2124.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">receive() returns (Alice, audio)</text>
<polyline points="1070,2220 1490,2220" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="1085" y="2204.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">send(audio)</text>
<polyline points="1490,2300 1070,2300" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="7 5"/>
<text x="1085" y="2284.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">events(): Spanish text / audio delta</text>
<polyline points="1070,2380 650,2380" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="665" y="2364.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">publish → lock → emit(event)</text>
<polyline points="650,2460 230,2460" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="7 5"/>
<text x="245" y="2444.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">result for Jorge</text>
<text x="100" y="2570.0" fill="#1e293b" font-size="20" font-family="Arial,sans-serif">Jorge’s audio follows the same path through the second provider, producing English output for Alice.</text>
<text x="100" y="2610.0" fill="#1e293b" font-size="20" font-family="Arial,sans-serif">Output tasks keep receiving results while forward_audio() waits for new audio. The lock serializes client sends.</text>
<polyline points="230,2680 650,2680" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="245" y="2664.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">end</text>
<polyline points="650,2750 1070,2750" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="7 5"/>
<text x="665" y="2734.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">receive() returns None</text>
<polyline points="1070,2820 1490,2820" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="1085" y="2804.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">finish(): request final output</text>
<polyline points="1070,2890 1910,2890" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="1085" y="2874.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">finish(): request final output</text>
<text x="1090" y="2938.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Wait for both output tasks (up to 15 seconds).</text>
<text x="1090" y="2961.4" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Final deltas use the same publish path above.</text>
<polyline points="1070,3050 650,3050" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="665" y="3034.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">publish ended → emit()</text>
<polyline points="650,3120 230,3120" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  stroke-dasharray="7 5"/>
<text x="245" y="3104.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">ended</text>
<polyline points="1070,3200 1910,3200" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="1085" y="3184.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Exit async with: close provider connections</text>
<polyline points="650,3300 230,3300" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#end)"  />
<text x="245" y="3284.0" fill="#1e293b" font-size="18" font-family="Arial,sans-serif">Close client WebSocket</text>
<text x="100" y="3409.0" fill="#1e293b" font-size="19" font-family="Arial,sans-serif">finish() requests completion; leaving async with closes connections. Fake providers use in-memory queues instead of sockets.</text></svg>
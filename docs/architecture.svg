<text x="290" y="441.0" fill="#1e293b" font-size="21" font-family="Arial,sans-serif">Client / media bridge</text>
<text x="290" y="482.0" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">Labels microphone audio</text>
<text x="290" y="504.1" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">Plays results by recipient</text>
<text x="290" y="526.2" fill="#1e293b" font-size="17" font-family="Arial,sans-serif">Outside this skeleton</text>
